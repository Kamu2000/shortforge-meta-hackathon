[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-director"
version = "0.1.0"
description = "Verifiable Spatial Director - Meta Global AI Developer Hackathon entry (Team ShortForge, Startup Track, Build for Your World)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "Pillow",
    # Meta's official parser library for the SAM segmentation
    # protocol: decodes SAM 3.1 mask payloads (custom-base85 over a
    # context-coded arithmetic stream) into rasters. See README.
    "meta-sam-parser>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
